<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="icon" href="https://cdn.glitch.com/4b280b2d-a546-43eb-95ad-5d0cedbb8304%2Ficono.png?v=1621562191466" type="image/png">    
  </head>  

  <body style="margin: opx; overflow: hidden">
<a-scene embedded arjs>
      <a-marker-camera          
        type="pattern" preset="custom" 
        url="https://rawcdn.githack.com/GPB-Cosmo/visualizaciones/1e9b1d810ed11a65736f5554b72549858bf84d88/Pulsar/e83f3976-6da0-4693-8b2f-3a00503baa97-ddf65f57-7534-4fe5-9259-9663271e181a_pattern-logo.patt">	        
        <a-entity gltf-model="#modeloblender" scale="0.1 0.1 0.1"></a-entity>

        <a-entity
          gltf-model="#modeloblender1" scale="0.1 0.1 0.1" position="1.5 0 -1.5" animation="property:position;to:0 0 0;delay:25000;dur:15000;loop:false;dir:alternate;">    
        </a-entity>

        <a-sphere color="#15ff00" position="1.5 0 -1.5" opacity="0.6" scale="0.441022 0.441022 0.441022" animation="property:position;to:0 0 0;delay:25000;dur:15000;loop:false;dir:alternate;">         
        </a-sphere>

        <a-entity gltf-model="#modeloblender2" scale="0.1 0.1 0.1" position="-2.3 0 -1.5" animation="property:position;to:0 0 0;delay:2000;dur:15000;loop:1;dir:alternate;">         
        </a-entity>

        <a-box color="#15ff00" position="-2.3 0 -1.5" opacity="0.6" scale=".5576 .5576 .5576" animation="property:position;to:0 0 0;delay:2000;dur:15000;loop:1;dir:alternate;">        
        </a-box>
      </a-marker-camera>

      <!--Modelo carga puntual-->
      <a-assets>
        <a-asset-item
          id="modeloblender"
          src="modelo carga p.glb"
        >
        </a-asset-item>
        <!--Modelo vector diferencial esfera-->
        <a-asset-item
          id="modeloblender1"
          src="vectores.glb"
        >
        </a-asset-item>
        <!--Modelo vectores diferenciales cubo-->
        <a-asset-item
          id="modeloblender2"
          src="vectores cubo.glb"
        >
        </a-asset-item>
      </a-assets>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
