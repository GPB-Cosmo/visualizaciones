<svg width="700" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200">
  <!-- Fondo -->
  <rect width="700" height="200" fill="#1a1a2e"/>
  
  <!-- Primera esfera: roja con p⁺ -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="40" fill="#ff4444" stroke="#cc0000" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
      p<tspan font-size="16" dy="-8">+</tspan>
    </text>
  </g>
  
  <!-- Símbolo + entre el primer par de esferas -->
  <g transform="translate(160, 100)">
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold">+</text>
  </g>
  
  <!-- Segunda esfera: azul con e⁻ (más pequeña) -->
  <g transform="translate(220, 100)">
    <circle cx="0" cy="0" r="25" fill="#4444ff" stroke="#0000cc" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
      e<tspan font-size="12" dy="-6">-</tspan>
    </text>
  </g>
  
  <!-- Flecha más larga y centrada entre las esferas centrales -->
  <g transform="translate(350, 100)">
    <!-- Línea de la flecha (más larga) -->
    <line x1="-40" y1="0" x2="40" y2="0" stroke="white" stroke-width="3"/>
    <!-- Punta de la flecha -->
    <polygon points="40,0 30,-8 30,8" fill="white"/>
  </g>
  
  <!-- Tercera esfera: blanca con n (más grande) -->
  <g transform="translate(480, 100)">
    <circle cx="0" cy="0" r="50" fill="#ffffff" stroke="#cccccc" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="black" font-family="Arial, sans-serif" font-size="28" font-weight="bold">n</text>
  </g>
  
  <!-- Símbolo + entre el segundo par de esferas -->
  <g transform="translate(560, 100)">
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold">+</text>
  </g>
  
  <!-- Cuarta esfera: blanca con ν (la más pequeña) -->
  <g transform="translate(620, 100)">
    <circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#cccccc" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="black" font-family="Arial, sans-serif" font-size="16" font-weight="bold">ν</text>
  </g>
</svg>