<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="icon" href="https://cdn.glitch.com/4b280b2d-a546-43eb-95ad-5d0cedbb8304%2Ficono.png?v=1621562191466" type="image/png">    
  </head>  
  <body style="margin: opx; overflow: hidden">
    <a-scene embedded arjs>
      <!--Modelo-->
      <a-assets>
        <a-asset-item
          id="modeloblender"
          src="dipolo encerado.glb"
        ></a-asset-item>
      </a-assets>    

      <a-marker-camera          
        type="pattern" preset="custom" 
        url="https://rawcdn.githack.com/GPB-Cosmo/visualizaciones/1e9b1d810ed11a65736f5554b72549858bf84d88/Pulsar/e83f3976-6da0-4693-8b2f-3a00503baa97-ddf65f57-7534-4fe5-9259-9663271e181a_pattern-logo.patt">		
        <a-entity gltf-model="#modeloblender" scale="0.1 0.1 0.1"></a-entity>

<a-box color ="#15ff00" position="-2 -0.15 -0.15" opacity="0.6" scale="0.5 0.5 2" animation="property:position; to: 0 -0.15 -0.15; begin:1000; dur:10000;loop:1;dir:alternate;">          
          </a-box> 

        
        <a-sphere color ="#15ff00" position="1.5 0 -0.3" opacity="0.6" scale="0.21 0.21 0.21" animation="property:position;to:0 0 -0.3;delay:14000;dur:5000:loop:1;dir:alternate;">          
    </a-sphere>
        
        <a-box color ="#15ff00" position="1.5 0 0.3" opacity="0.6" scale="0.25 0.25 0.25" animation="property:position;to:0 0 0.3;delay:14000;dur:5000:loop:1;dir:alternate;">          
    </a-box>                
      </a-marker>      
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
