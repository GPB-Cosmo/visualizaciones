<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://aframe.io/releases/0.8.0/aframe.min.js"></script>
    <script src="https://jeromeetienne.github.io/AR.js/aframe/build/aframe-ar.js"></script>
    <link rel="icon" href="https://cdn.glitch.com/4b280b2d-a546-43eb-95ad-5d0cedbb8304%2Ficono.png?v=1621562191466" type="image/png">
  </head>

  <body>
    <a-scene embedded arjs>
      <!--Modelos de blender-->
      <a-assets>
        <!--Modelo-->
        <a-asset-item id="modelo" src="Solenoide estirado.dae"></a-asset-item>        
      </a-assets>

      <!--Marcador-->
      <a-marker type="pattern" preset="custom" 
        url="https://rawcdn.githack.com/GPB-Cosmo/visualizaciones/1e9b1d810ed11a65736f5554b72549858bf84d88/Pulsar/e83f3976-6da0-4693-8b2f-3a00503baa97-ddf65f57-7534-4fe5-9259-9663271e181a_pattern-logo.patt">
        <a-entity position="0 0.7 0" collada-model="#modelo" scale="0.5 0.5 0.5"></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
